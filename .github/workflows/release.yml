name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify release artifacts
        run: ./scripts/build-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping publication."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" "dist/datashelf-$GITHUB_REF_NAME-"* "dist/SHA256SUMS-$GITHUB_REF_NAME" dist/NOTICE dist/THIRD_PARTY_LICENSES --generate-notes --title "DataShelf $GITHUB_REF_NAME"
